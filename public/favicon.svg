<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="50%" stop-color="#FF451A"/>
      <stop offset="100%" stop-color="#E02E00"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF451A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)" stroke="#FF451A" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- Stylized Eduzy "E" Mark with Modern Geometry -->
  <g filter="url(#shadow)">
    <!-- Vertical stem -->
    <rect x="34" y="34" width="15" height="60" rx="7.5" fill="url(#primary)"/>
    
    <!-- Top bar with angled cut -->
    <path d="M42 34 H88 C92 34 94 36.5 93 40.5 L91 46 C90 48.5 87.5 49 84 49 H42 V34 Z" fill="url(#primary)"/>
    
    <!-- Middle bar with accent spark -->
    <rect x="42" y="56" width="34" height="15" rx="7.5" fill="url(#primary)"/>
    
    <!-- Bottom bar -->
    <path d="M42 79 H86 C89.5 79 91.5 80.5 91 83.5 L89 89.5 C88 92.5 85 94 82 94 H42 V79 Z" fill="url(#primary)"/>

    <!-- Educational Spark / Star -->
    <path d="M96 24 L98.5 32 L106.5 34.5 L98.5 37 L96 45 L93.5 37 L85.5 34.5 L93.5 32 Z" fill="url(#accent)"/>
  </g>
</svg>
